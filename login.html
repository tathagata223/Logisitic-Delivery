<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			font-family: Arial, sans-serif;
			background: linear-gradient(135deg, #eef2ff, #dbeafe);
			color: #1e293b;
		}
		.login-card {
			width: min(100%, 400px);
			padding: 36px;
			background: #fff;
			border-radius: 16px;
			box-shadow: 0 16px 40px rgba(30, 41, 59, .15);
		}
		h1 { margin: 0 0 8px; text-align: center; font-size: 28px; }
		.subtitle { margin: 0 0 28px; text-align: center; color: #64748b; }
		label { display: block; margin: 16px 0 7px; font-size: 14px; font-weight: 600; }
		input {
			width: 100%;
			padding: 12px 14px;
			border: 1px solid #cbd5e1;
			border-radius: 8px;
			font-size: 15px;
		}
		input:focus { outline: 2px solid #6366f1; border-color: transparent; }
		.options { display: flex; justify-content: space-between; align-items: center; margin: 16px 0 24px; font-size: 13px; }
		.remember { display: flex; gap: 7px; align-items: center; color: #64748b; }
		.remember input { width: auto; }
		a { color: #4f46e5; text-decoration: none; }
		button {
			width: 100%;
			padding: 13px;
			border: 0;
			border-radius: 8px;
			background: #4f46e5;
			color: #fff;
			font-size: 16px;
			font-weight: 700;
			cursor: pointer;
		}
		button:hover { background: #4338ca; }
		.signup { margin: 24px 0 0; text-align: center; color: #64748b; font-size: 14px; }
	</style>
</head>
<body>
	<main class="login-card">
		<h1>Welcome Back</h1>
		<p class="subtitle">Sign in to continue to your account</p>
		<form method="POST" action="/">
			<label for="email">Email address</label>
			<input id="email" name="email" type="email" placeholder="you@example.com" required>

			<label for="password">Password</label>
			<input id="password" name="password" type="password" placeholder="Enter your password" required>

			<div class="options">
				<label class="remember"><input type="checkbox" name="remember"> Remember me</label>
				<a href="#">Forgot password?</a>
			</div>
			<button type="submit">Sign In</button>
		</form>
		<p class="signup">Don't have an account? <a href="#">Create one</a></p>
	</main>
</body>
</html>
